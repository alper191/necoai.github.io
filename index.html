<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#04070f">
  <meta name="description" content="NECO.AI — Yapay zekâ sohbet asistanınız. Soru sorun, fikir üretin, metin yazın, kodlama desteği alın.">
  <title>NECO.AI — Yapay Zekâ Asistanı</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300a8ff'/%3E%3Cstop offset='1' stop-color='%2300e5ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%23070d1d'/%3E%3Cpath d='M22 38 L30 18 L42 28 L50 20 L58 28 L70 18 L78 38 C84 48 80 60 66 62 L60 78 L40 78 L34 62 C20 60 16 48 22 38 Z' fill='url(%23g)'/%3E%3Ccircle cx='38' cy='44' r='4' fill='%23070d1d'/%3E%3Ccircle cx='62' cy='44' r='4' fill='%23070d1d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    html,body{margin:0;background:#04070f;color:#e8f1ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;}
    svg{max-width:100%;height:auto;}
    #app{min-height:100vh;}
  </style>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 100 100" width="42" height="42" aria-hidden="true">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#00a8ff"/><stop offset="1" stop-color="#00e5ff"/>
              </linearGradient>
            </defs>
            <path d="M22 38 L30 18 L42 28 L50 20 L58 28 L70 18 L78 38 C84 48 80 60 66 62 L60 78 L40 78 L34 62 C20 60 16 48 22 38 Z" fill="url(#lg)"/>
            <circle cx="38" cy="44" r="4" fill="#070d1d"/><circle cx="62" cy="44" r="4" fill="#070d1d"/>
          </svg>
          <span class="brand-name">NECO<span>.AI</span></span>
        </div>
        <button id="sidebarClose" class="icon-btn mobile-only" aria-label="Menüyü kapat">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>

      <button id="newChatBtn" class="btn-new">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        <span data-i18n="newChat">Yeni Sohbet</span>
      </button>

      <div class="sidebar-label" data-i18n="chats">Sohbetler</div>
      <div id="chatList" class="chat-list"></div>

      <div class="sidebar-foot">
        <button id="clearAllBtn" class="btn-ghost">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0l-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
          <span data-i18n="clearAll">Tümünü Sil</span>
        </button>
        <button id="logoutBtn" class="btn-ghost" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span data-i18n="logout">Çıkış Yap</span>
        </button>
        <button id="loginMenuBtn" class="btn-ghost">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span data-i18n="loginMenuBtn">Giriş Yap / Kaydol</span>
        </button>
        <div class="lang-switch" role="group" aria-label="Dil seçimi">
          <button type="button" class="lang-btn active" data-lang="tr">TR</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only" aria-label="Menüyü aç">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <div class="topbar-title">
          <span class="topbar-brand mobile-only">NECO<span>.AI</span></span>
          <span id="chatTitle" class="chat-title desktop-only"></span>
        </div>
        <div class="status-badge" title="NECO.AI çevrimiçi">
          <span class="dot"></span>
          <span data-i18n="online">Çevrimiçi</span>
        </div>
      </header>

      <div id="chatScroll" class="chat-scroll">
        <section id="welcome" class="welcome">
          <div class="welcome-logo">
            <svg viewBox="0 0 100 100" width="96" height="96" aria-hidden="true">
              <defs>
                <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#00a8ff"/><stop offset="1" stop-color="#00e5ff"/>
                </linearGradient>
              </defs>
              <path d="M22 38 L30 18 L42 28 L50 20 L58 28 L70 18 L78 38 C84 48 80 60 66 62 L60 78 L40 78 L34 62 C20 60 16 48 22 38 Z" fill="url(#wg)"/>
              <circle cx="38" cy="44" r="4" fill="#070d1d"/><circle cx="62" cy="44" r="4" fill="#070d1d"/>
            </svg>
          </div>
          <h1 id="welcomeTitle" class="welcome-title" data-i18n="welcomeTitle">Merhaba, ben NECO.AI</h1>
          <p class="welcome-sub" data-i18n="welcomeSub">Sana nasıl yardımcı olabilirim? Soru sor, fikir üret, metin yaz veya kodlama desteği al.</p>
          <div id="suggestions" class="suggestions"></div>
        </section>

        <section id="messages" class="messages" hidden></section>
      </div>

      <footer class="composer-wrap">
        <div id="attachments" class="attachments" hidden></div>
        <form id="composer" class="composer" autocomplete="off">
          <button type="button" id="attachBtn" class="composer-btn" aria-label="Dosya ekle" title="Dosya ekle">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21.4 11.05l-8.48 8.49a6 6 0 0 1-8.49-8.49l8.49-8.49a4 4 0 0 1 5.66 5.66l-8.49 8.48a2 2 0 0 1-2.83-2.83l7.78-7.78" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          </button>
          <textarea id="input" rows="1" maxlength="30000" placeholder="NECO.AI'a bir şey sor..."></textarea>
          <button type="submit" id="sendBtn" class="composer-btn send" aria-label="Gönder" title="Gönder">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <button type="button" id="stopBtn" class="composer-btn stop" aria-label="Durdur" title="Durdur" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          </button>
        </form>
        <div class="composer-note" data-i18n="hint">Enter ile gönder · Shift+Enter yeni satır</div>
      </footer>
    </main>
  </div>

  <div id="authOverlay" class="login-overlay">
    <div class="login-card">
      <svg class="login-logo" viewBox="0 0 100 100" width="84" height="84" aria-hidden="true">
        <defs>
          <linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00a8ff"/><stop offset="1" stop-color="#00e5ff"/>
          </linearGradient>
        </defs>
        <path d="M22 38 L30 18 L42 28 L50 20 L58 28 L70 18 L78 38 C84 48 80 60 66 62 L60 78 L40 78 L34 62 C20 60 16 48 22 38 Z" fill="url(#lgg)"/>
        <circle cx="38" cy="44" r="4" fill="#070d1d"/><circle cx="62" cy="44" r="4" fill="#070d1d"/>
      </svg>
      <h1 class="login-title">NECO<span>.AI</span></h1>

      <div id="authView">
        <div class="auth-tabs" role="tablist">
          <button type="button" id="loginTab" class="auth-tab active" data-i18n="loginTab">Giriş</button>
          <button type="button" id="registerTab" class="auth-tab" data-i18n="registerTab">Kaydol</button>
        </div>
        <p class="login-sub" id="authSub" data-i18n="loginSub">E-postanla giriş yap</p>
        <form id="authForm" class="login-form" autocomplete="off">
          <input id="authEmail" type="email" inputmode="email" maxlength="254" autocomplete="email" placeholder="E-posta" aria-label="E-posta">
          <input id="authPass" type="password" maxlength="128" autocomplete="current-password" placeholder="Şifre" aria-label="Şifre">
          <button type="submit" id="authSubmit" class="login-btn" data-i18n="loginBtn">Giriş Yap</button>
        </form>
        <p id="authError" class="login-error" hidden></p>
        <button type="button" id="adminLink" class="auth-link" data-i18n="adminLink">Yönetici Girişi</button>
      </div>

      <div id="adminView" hidden>
        <p class="login-sub" data-i18n="adminSub">Kayıtlı kullanıcıları görüntüle</p>
        <form id="adminForm" class="login-form" autocomplete="off">
          <input id="adminPass" type="password" maxlength="64" placeholder="Yönetici şifresi" aria-label="Yönetici şifresi">
          <button type="submit" class="login-btn" data-i18n="adminShow">Listeyi Göster</button>
        </form>
        <p id="adminError" class="login-error" hidden></p>
        <div id="adminResult" class="admin-result" hidden></div>
        <button type="button" id="adminBack" class="auth-link" data-i18n="adminBack">Geri Dön</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" hidden
    accept=".txt,.md,.markdown,.csv,.json,.log,.js,.mjs,.ts,.tsx,.jsx,.py,.java,.c,.h,.cpp,.cs,.go,.rs,.rb,.php,.swift,.kt,.sql,.xml,.yml,.yaml,.toml,.ini,.sh,.bat,.ps1,.css,.scss,.tex,.r,.m,.pl,.lua,.vue,.svelte">

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle" class="modal-title"></h3>
      <p id="modalText" class="modal-text"></p>
      <div class="modal-actions">
        <button id="modalCancel" class="btn-secondary"></button>
        <button id="modalConfirm" class="btn-danger"></button>
      </div>
    </div>
  </div>

  <div id="previewOverlay" class="preview-overlay" hidden>
    <div class="preview-box" role="dialog" aria-modal="true">
      <div class="preview-head">
        <span class="preview-title" data-i18n="preview">Önizle</span>
        <span class="code-actions">
          <button id="previewOpen" type="button" class="copy-btn" data-i18n="previewOpen">Yeni Sekmede Aç</button>
          <button id="previewClose" type="button" class="copy-btn" data-i18n="close">Kapat</button>
        </span>
      </div>
      <iframe id="previewFrame" class="preview-frame" title="HTML önizleme"></iframe>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="assets/app.js"></script>
</body>
</html>
